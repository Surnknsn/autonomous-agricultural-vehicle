<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AMR System Flowchart</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --paper: #ffffff;
      --ink: #1b1f24;
      --muted: #5d6673;
      --line: #d9dee7;
      --accent: #0b6bcb;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 10px 18px;
      background: rgba(255,255,255,0.94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(8px);
    }
    .toolbar strong {
      margin-right: auto;
    }
    button {
      border: 1px solid var(--accent);
      background: var(--accent);
      color: white;
      border-radius: 6px;
      padding: 8px 12px;
      cursor: pointer;
      font-weight: 600;
    }
    button.secondary {
      background: white;
      color: var(--accent);
    }
    main {
      max-width: 1120px;
      margin: 22px auto 48px;
      padding: 38px 46px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 8px 28px rgba(20, 30, 50, 0.08);
    }
    h1, h2, h3 {
      line-height: 1.25;
      page-break-after: avoid;
    }
    h1 {
      margin-top: 0;
      font-size: 30px;
    }
    h2 {
      margin-top: 36px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
      font-size: 22px;
    }
    h3 {
      margin-top: 26px;
      font-size: 18px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      margin: 14px 0 22px;
      font-size: 14px;
      page-break-inside: avoid;
    }
    th, td {
      border: 1px solid var(--line);
      padding: 8px 10px;
      vertical-align: top;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    th {
      background: #eef4fb;
      text-align: left;
    }
    code {
      background: #eef1f5;
      padding: 1px 5px;
      border-radius: 4px;
    }
    pre {
      overflow: auto;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      background: #f3f5f8;
      padding: 14px;
      border-radius: 7px;
      border: 1px solid var(--line);
    }
    .mermaid {
      margin: 18px 0 28px;
      padding: 12px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 7px;
      text-align: center;
      page-break-inside: avoid;
      overflow: hidden;
      max-width: 100%;
    }
    .mermaid svg {
      display: block;
      max-width: 100% !important;
      width: 100% !important;
      height: auto !important;
      margin: 0 auto;
    }
    .hint {
      color: var(--muted);
      font-size: 13px;
    }
    @media print {
      @page {
        size: A4 landscape;
        margin: 8mm;
      }
      body {
        background: white;
        font-size: 10.5px;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      .toolbar {
        display: none;
      }
      main {
        max-width: none;
        margin: 0;
        padding: 0;
        border: 0;
        box-shadow: none;
      }
      h1 {
        font-size: 22px;
      }
      h2 {
        font-size: 17px;
      }
      h3 {
        font-size: 14px;
      }
      table {
        font-size: 8.8px;
        table-layout: fixed;
      }
      pre, .mermaid {
        page-break-inside: avoid;
      }
      .mermaid {
        padding: 6px;
        margin: 10px 0 16px;
        overflow: hidden;
      }
      .mermaid svg {
        max-width: 100% !important;
        width: 100% !important;
        height: auto !important;
      }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <strong>AMR System Flowchart</strong>
    <span class="hint">เปิดผ่าน local server แล้วกด Save PDF</span>
    <button class="secondary" onclick="location.reload()">Reload</button>
    <button onclick="window.print()">Save PDF</button>
  </div>
  <main id="content">
    <p>Loading Markdown and Mermaid...</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <script>
    const content = document.getElementById('content');

    function escapeHtml(text) {
      return text
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;');
    }

    function renderMarkdownWithMermaid(md) {
      const parts = md.split(/```mermaid\n([\s\S]*?)```/g);
      let html = '';
      for (let i = 0; i < parts.length; i++) {
        if (i % 2 === 0) {
          html += marked.parse(parts[i]);
        } else {
          const idx = Math.floor(i / 2) + 1;
          html += `<div class="mermaid" data-diagram="${idx}">${escapeHtml(parts[i].trim())}</div>`;
        }
      }
      return html;
    }

    function errorText(err) {
      if (err == null) return 'unknown error';
      if (typeof err === 'string') return err;
      if (err.message) return err.message;
      try {
        return JSON.stringify(err, null, 2);
      } catch (_) {
        return String(err);
      }
    }

    async function renderMermaidSafely() {
      const diagrams = Array.from(document.querySelectorAll('.mermaid'));
      for (const el of diagrams) {
        const code = el.textContent.trim();
        const idx = el.dataset.diagram || '?';
        try {
          const id = `mermaid-diagram-${idx}-${Date.now()}`;
          const result = await mermaid.render(id, code);
          el.innerHTML = result.svg;
        } catch (err) {
          el.innerHTML = `
            <div style="text-align:left;color:#b00020;font-weight:700;margin-bottom:8px;">
              Mermaid diagram ${idx} render failed
            </div>
            <pre style="white-space:pre-wrap;text-align:left;">${escapeHtml(errorText(err))}</pre>
            <pre style="white-space:pre-wrap;text-align:left;">${escapeHtml(code)}</pre>
          `;
        }
      }
    }

    async function load() {
      try {
        mermaid.initialize({
          startOnLoad: false,
          theme: 'default',
          flowchart: { useMaxWidth: true, htmlLabels: true },
          sequence: { useMaxWidth: true }
        });
        const res = await fetch('system_flowchart.md', { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const md = await res.text();
        content.innerHTML = renderMarkdownWithMermaid(md);
        await renderMermaidSafely();
      } catch (err) {
        content.innerHTML = `
          <h1>เปิดไฟล์ไม่สำเร็จ</h1>
          <p>ให้เปิดผ่าน local server จากโฟลเดอร์ <code>/home/iai/ros2_foxy_ws</code></p>
          <pre>cd /home/iai/ros2_foxy_ws
python3 -m http.server 8888</pre>
          <p>แล้วเข้า <code>http://localhost:8888/system_flowchart_view.html</code></p>
          <p>Error: ${escapeHtml(errorText(err))}</p>
        `;
      }
    }

    load();
  </script>
</body>
</html>
